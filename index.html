<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0D12">
<title>AN Committees</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://srqiphdhpgrrnpvkvkly.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--ink2:#1c1c1c;--paper:#ECEAE2;--card:#fff;--line:#E4E1D6;--tx:#111;--mu:#6B6B63;--brand:#111;--brandd:#111;--brandl:#EAF7C8;--amber:#7A5200;--amberl:#FFEFC2;--red:#B42318;--redl:#FCE4E0;--lime:#C8F169}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--paper);color:var(--tx);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;letter-spacing:-.01em}
h2{font-size:17px;margin-bottom:12px}
h3{font-size:15px;margin-bottom:10px}
.sec{margin:28px 0 12px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.muted{color:var(--mu);font-size:13px}

.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--ink);color:#C9D3E6;display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;color:#fff;padding:4px 8px 18px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav button{position:relative;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#B8C4DA;padding:10px 12px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600;text-align:left;width:100%;transition:background .15s,color .15s}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:rgba(52,211,168,.14);color:#fff}
.nav button.on svg{color:#34D3A8}
.nav .cnt{margin-left:auto;background:#F0B44C;color:#3a2600;border-radius:999px;font-size:12px;font-weight:800;padding:0 7px;min-width:20px;text-align:center}
.who{display:flex;align-items:center;gap:10px;padding:14px 8px 0;border-top:1px solid rgba(255,255,255,.1);margin-top:10px}
.av{width:34px;height:34px;border-radius:10px;background:#34D3A8;color:#06352A;display:grid;place-items:center;font-weight:800;flex:none}
.wn{display:flex;flex-direction:column;min-width:0;flex:1}
.wn b{color:#fff;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wn span{font-size:12px;color:#8FA0BF}
.ico{border:0;background:transparent;color:#B8C4DA;cursor:pointer;padding:7px;border-radius:8px;display:grid;place-items:center}
.ico:hover{background:rgba(255,255,255,.08);color:#fff}
.main{min-width:0}
.wrap{max-width:1080px;margin:0 auto;padding:28px 28px 56px}
.mtop{display:none}
.ph{margin-bottom:20px}
.ph h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.ph p{margin:2px 0 0;color:var(--mu)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.card.tw{padding:6px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.grid .card{margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.two .card{margin:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tw{overflow-x:auto}

.hero{background:var(--ink);color:#fff;border-radius:18px;padding:24px 26px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:20px}
.hl{color:#9FB0CE;font-size:14px;font-weight:600}
.hv{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:2px 0}
.hs{color:#9FB0CE;font-size:14px}
.hstrip{display:flex;gap:30px;margin:0;align-self:flex-end;flex-wrap:wrap}
.hstrip dt{color:#9FB0CE;font-size:13px}
.hstrip dd{margin:0;font-size:20px;font-weight:700}

.list .li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:14px}
.li .t span{color:var(--mu);font-size:13px}
.li .amt2{font-weight:700}
.note{background:var(--amberl);color:var(--amber);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-weight:600}

.cc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.amt{font-size:24px;font-weight:800;letter-spacing:-.02em}
.amt small{font-size:13px;font-weight:600;color:var(--mu);letter-spacing:0}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.slot{width:28px;height:28px;border-radius:8px;border:1.5px dashed #C4CCDA;color:#98A2B3;display:grid;place-items:center;font-size:12px;font-weight:700}
.slot.on{border:1.5px solid var(--brand);background:var(--brandl);color:var(--brandd)}
.slot.me{background:var(--brand);border-color:var(--brand);color:#fff}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:6px}

label{display:block;font-size:13px;font-weight:600;color:#475467;margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #CBD2DE;border-radius:10px;font:inherit;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(10,124,102,.15)}
input[type=radio]{width:auto}
.btn{background:var(--brand);color:#fff;border:0;padding:11px 18px;border-radius:10px;cursor:pointer;font:inherit;font-size:14px;font-weight:700;transition:background .15s}
.btn:hover{background:var(--brandd)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn.red{background:var(--redl);color:var(--red)}
.btn.red:hover{background:#F6D3CE}
.btn.gray{background:#EEF1F6;color:#344054}
.btn.gray:hover{background:#E1E6EF}
.btn.out{background:#fff;color:var(--brandd);border:1px solid #BFE3D8}
.btn.out:hover{background:var(--brandl)}
.actions{display:flex;gap:6px;flex-wrap:wrap}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);color:var(--mu);font-weight:600;font-size:13px;white-space:nowrap}
td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}

.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;text-transform:capitalize}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.pending{background:var(--amberl);color:var(--amber)}
.badge.approved,.badge.verified,.badge.paid,.badge.open{background:var(--brandl);color:var(--brandd)}
.badge.rejected,.badge.closed{background:var(--redl);color:var(--red)}

.bank{background:var(--brandl);border:1px solid #BFE3D8;border-radius:12px;padding:12px 14px;margin:10px 0;line-height:1.7}
.empty{text-align:center;color:var(--mu);padding:34px 16px;border:1.5px dashed #CBD2DE;border-radius:14px;background:#fff;margin-bottom:14px}
.empty svg{color:#98A2B3;margin-bottom:6px}
.empty p{margin:0 0 12px}
.stat{font-size:26px;font-weight:800;color:var(--brand)}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;display:none;z-index:99;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(18,32,58,.25);font-weight:600}
#toast.err{background:var(--red)}

.auth{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh}
.ap{background:var(--ink);color:#fff;padding:40px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.ap .brand{padding:0}
.ap h1{font-size:38px;line-height:1.12;font-weight:800;letter-spacing:-.02em;margin:0 0 14px;max-width:16ch}
.ap p{color:#B8C4DA;max-width:42ch;margin:0}
.ap .slots{margin-top:28px;max-width:300px}
.ap .slot{width:38px;height:38px;border-color:rgba(255,255,255,.25);color:rgba(255,255,255,.5);font-size:14px}
.ap .slot.on{background:rgba(52,211,168,.18);border-color:#34D3A8;color:#8CF0D0}
.ap .slot.me{background:#34D3A8;color:#06352A;border-color:#34D3A8}
.fine{color:#8FA0BF;font-size:13px}
.af{display:grid;place-items:center;padding:32px 20px;background:#fff}
.af-in{width:100%;max-width:390px}
.af h2{font-size:26px;font-weight:800;margin-bottom:4px;letter-spacing:-.02em}
.seg{display:flex;background:#EEF1F6;border-radius:10px;padding:4px;margin:20px 0 4px}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:8px;font:inherit;font-weight:700;color:#475467;cursor:pointer}
.seg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 3px rgba(16,24,40,.12)}

@media(max-width:899px){
  .shell{display:block}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
  .side .brand,.side .who{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:2px}
  .nav button{flex-direction:column;gap:3px;font-size:11px;padding:7px 10px;width:auto;min-width:70px;align-items:center;text-align:center;white-space:nowrap}
  .nav .cnt{position:absolute;top:2px;right:10px;margin:0;font-size:11px;min-width:18px}
  .mtop{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;padding:12px 16px}
  .mtop .brand{padding:0}
  .wrap{padding:18px 16px 110px}
  .ph h1{font-size:22px}
  .hv{font-size:32px}
  .two{grid-template-columns:1fr}
  #toast{bottom:90px}
  .auth{grid-template-columns:1fr}
  .ap{padding:22px 20px;gap:0}
  .ap h1{font-size:24px;margin:0}
  .ap .slots,.ap p,.fine{display:none}
  .af{padding:24px 20px 40px;place-items:start center}
}
@media(max-width:560px){.row{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
:root{--gold:#C8F169}
.btn:active{transform:scale(.97)}
.btn.busy{position:relative;color:transparent!important;pointer-events:none}
.btn.busy::after{content:'';position:absolute;inset:0;margin:auto;width:16px;height:16px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;animation:rot .6s linear infinite}
.ringbox{display:grid;place-items:center;margin:8px 0 2px}
.ringbox svg,.ring-demo svg{width:100%;max-width:230px;height:auto;overflow:visible}
.track{fill:none;stroke:#E8ECF3;stroke-width:2}
.dot circle{fill:#fff;stroke:#C4CCDA;stroke-width:1.5;transition:fill .5s,stroke .5s}
.dot text{font-size:11px;font-weight:700;text-anchor:middle;fill:#667085;pointer-events:none}
.dot.done circle{fill:var(--brand);stroke:var(--brand)}
.dot.done text{fill:#fff}
.dot.now circle{fill:var(--gold);stroke:var(--gold);animation:halo 1.8s ease-out infinite}
.dot.now text{fill:#2b1d00}
.dot.empty circle{stroke-dasharray:3 3;fill:none}
.dot.me circle{stroke:var(--ink);stroke-width:3.5;animation:none}
.rc1{font-size:25px;font-weight:800;text-anchor:middle;fill:var(--ink)}
.rc2{font-size:14px;font-weight:600;text-anchor:middle;fill:var(--mu)}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;color:var(--mu);font-size:12px;margin:2px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.lg{width:10px;height:10px;border-radius:50%;display:inline-block;border:1.5px solid #C4CCDA}
.lg.done{background:var(--brand);border-color:var(--brand)}.lg.now{background:var(--gold);border-color:var(--gold)}.lg.me{border:2.5px solid var(--ink)}
.pay-line{margin:6px 0;font-size:14px}
@keyframes halo{0%{stroke-width:1.5;stroke-opacity:1}100%{stroke-width:11;stroke-opacity:0}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes slideIn{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes bye{to{opacity:0;transform:scale(.985) translateY(8px)}}
.shake{animation:shake .4s}
.shell.enter .side{animation:slideIn .45s cubic-bezier(.2,.8,.2,1)}
.shell.enter .main{animation:riseIn .5s .08s both cubic-bezier(.2,.8,.2,1)}
.shell.out{animation:bye .3s forwards}
.wrap.fade{animation:fadeIn .2s}
.auth.in .af-in{animation:riseIn .5s .05s both cubic-bezier(.2,.8,.2,1)}
.auth.in .ap{animation:fadeIn .5s}
.loading{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:14px;background:var(--ink);color:#9FB0CE;font-weight:600}
.spin{width:48px;height:48px;animation:rot 1s linear infinite}
.spin circle{stroke:#34D3A8;stroke-dasharray:90 150}
.ap .apc{display:grid;gap:14px;justify-items:start}
.ring-demo{width:100%;max-width:250px;margin-bottom:8px}
.ap .dot circle{fill:transparent;stroke:rgba(255,255,255,.28)}
.ap .dot text{fill:rgba(255,255,255,.75)}
.ap .dot.done circle{fill:#34D3A8;stroke:#34D3A8}
.ap .dot.done text{fill:#06352A}
.ap .dot.now circle{fill:var(--gold);stroke:var(--gold)}
.ap .dot.now text{fill:#2b1d00}
.ap .track{stroke:rgba(255,255,255,.12)}
.ap .rc1{fill:#fff}.ap .rc2{fill:#9FB0CE}
.mback{position:fixed;inset:0;background:rgba(10,18,36,.55);display:grid;place-items:center;padding:16px;z-index:60;animation:fadeIn .15s;backdrop-filter:blur(2px)}
.mbox{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:460px;max-height:90vh;overflow:auto;animation:pop .24s cubic-bezier(.2,.9,.3,1.15);box-shadow:0 24px 60px rgba(10,18,36,.35)}
.mbox.wide{max-width:640px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
dl.kv{margin:12px 0 0}
.kv>div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv dt{color:var(--mu)}.kv dd{margin:0;text-align:right;font-weight:600}
.warnbox{background:var(--amberl);color:var(--amber);padding:10px 12px;border-radius:10px;font-weight:600;font-size:13px;margin-top:14px}
.rcpt .rh{display:flex;gap:12px;align-items:center;color:var(--ink)}
.rcpt .rh b{display:block}.rcpt .rh span{font-size:12px;color:var(--mu)}.rcpt .rh .badge{margin-left:auto}
.ramt{font-size:36px;font-weight:800;margin:14px 0 2px;color:var(--brandd);letter-spacing:-.02em}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:6px 0 12px}
select.cell{padding:7px 8px;min-width:160px;border-radius:8px;width:auto}
tr.cur td{background:#FFF7E3}
label.chk{display:flex;align-items:center;gap:10px;color:var(--tx);font-weight:600}
label.chk input{width:auto}
@media(max-width:899px){.shell.enter .side{animation:none}.ring-demo{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.dot.now.empty circle{fill:#FFF3D1}
#lbtn,#sbtn{margin-top:18px}
.card{transition:transform .2s,box-shadow .2s}
.grid .card{animation:riseIn .45s both}
.grid .card:nth-child(2){animation-delay:.06s}.grid .card:nth-child(3){animation-delay:.12s}.grid .card:nth-child(n+4){animation-delay:.18s}
.grid .card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(18,32,58,.09)}
tr:hover td{background:#F8FAFC}td,.badge,.btn,.nav button{transition:background .2s,color .2s,transform .15s}
.slot,.dot circle{transition:all .4s}
.wheelbox{display:grid;place-items:center}.wheelbox svg{width:100%;max-width:360px;overflow:visible}
#w_c{margin-bottom:10px}

/* ===== Editorial Bento layout (black / lime) ===== */
body{font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
:focus-visible{outline-color:#111}
.shell{display:block}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:14px 28px;background:#ECEAE2}
.top .brand{padding:0;color:#111;font-size:19px;letter-spacing:-.03em;flex:none}
.nav{flex:none;margin:0 auto;display:flex;flex-direction:row;gap:2px;background:#111;border-radius:999px;padding:5px;position:relative;overflow:visible}
.nav button{width:auto;padding:9px 16px;font-size:13px;color:#CFCFC6;white-space:nowrap;border-radius:999px;gap:7px;position:relative}
.nav button svg{display:none}
@media(hover:hover){.nav button:hover{background:rgba(255,255,255,.1);color:#fff}}
.nav button.on{background:var(--lime);color:#111}
.nav button.onm{background:transparent;color:#CFCFC6}
.nav .cnt{margin-left:6px;background:#FF9F43;color:#111;font-size:11px;min-width:18px;padding:0 5px}
.mobonly{display:none}
.moremenu{position:absolute;top:calc(100% + 10px);right:0;background:#111;border-radius:22px;padding:8px;min-width:230px;display:none;flex-direction:column;gap:2px;z-index:50;box-shadow:0 18px 40px rgba(17,17,17,.3)}
.moremenu.open{display:flex}
.moremenu button{width:100%;justify-content:flex-start;padding:11px 14px}
.moremenu button svg{display:block}
.moremenu .mob{display:none}
.who{padding:0;border:0;margin:0 0 0 auto;display:flex;align-items:center;gap:10px;flex:none}
.av{background:#111;color:var(--lime);border-radius:50%}
.wn b{color:#111}
.wn span{color:#6B6B63}
.top .ico{color:#111;background:rgba(17,17,17,.07);border-radius:50%}
.top .ico:hover{background:var(--lime);color:#111}
.wrap{max-width:1180px;padding:24px 28px 64px}
.ph{margin-bottom:22px}
.ph h1{font-size:40px;letter-spacing:-.045em;font-weight:700}
h2{font-size:19px;letter-spacing:-.02em}
.card{border:0;border-radius:26px;padding:22px}
.bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(136px,auto);gap:14px;margin-bottom:24px}
.bt{background:#fff;border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:4px;min-width:0;animation:riseIn .45s both}
.bt.big{grid-column:span 2;grid-row:span 2;background:#111;color:#fff;padding:28px}
.bt.lime{background:var(--lime);color:#111}
.bl{font-size:13px;font-weight:600;color:#6B6B63}
.bt.big .bl{color:#A8A8A0}.bt.lime .bl{color:#2D3A0B}
.bv{font-size:46px;font-weight:700;letter-spacing:-.045em;line-height:1.05}
.bt.big .bv{font-size:62px;letter-spacing:-.055em;margin-top:6px}
.bv.sm{font-size:28px;margin-top:6px}
.bs{font-size:13px;color:#6B6B63}.bt.big .bs{color:#A8A8A0}
.bt .btn{margin-top:auto;align-self:flex-start}
.btn.dk{background:#111;color:#fff}.btn.dk:hover{background:#fff;color:#111}
.btn.lm{background:var(--lime);color:#111}.btn.lm:hover{background:#fff;color:#111}
.bars{margin-top:auto;display:flex;gap:10px;align-items:flex-end;height:120px;padding-top:14px}
.b6{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.b6 i{width:100%;background:#3A3A38;border-radius:10px;display:block}
.b6 i.cur{background:var(--lime)}
.b6 span{font-size:10px;color:#A8A8A0}
.bcta{margin-top:auto}
.bcta .btn{margin:0}
.amt,.stat{letter-spacing:-.03em}
.btn{background:#111;color:#fff;border-radius:999px;padding:12px 22px}
.btn:hover{background:var(--lime);color:#111}
.btn.sm{padding:8px 14px}
.btn.red{background:var(--redl);color:var(--red)}
.btn.red:hover{background:#F8CFC8;color:var(--red)}

/* ===== Obsidian & Brass theme ===== */
:root{color-scheme:dark;--ink:#0B0D12;--ink2:#12151C;--paper:#0B0D12;--card:#12151C;--c2:#1B1F2A;--line:#2A3040;--tx:#F3EDE0;--mu:#A09B8B;--brand:#C9A44C;--brandd:#E4C778;--brandl:rgba(201,164,76,.14);--amber:#E6A55C;--amberl:rgba(230,165,92,.14);--red:#F2998E;--redl:rgba(242,153,142,.13);--lime:#C9A44C;--gold:#E4C778;--on:#0B0D12;--gl:rgba(201,164,76,.16);--ok:#7FCB9B}
body{font-family:Manrope,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--paper);color:var(--tx);-webkit-font-smoothing:antialiased;overflow-x:hidden}

@keyframes aur{to{transform:translate(2vmax,2vmax) scale(1.1)}}
@keyframes shine{from{transform:translateX(-120%) skewX(-20deg)}to{transform:translateX(320%) skewX(-20deg)}}
@keyframes lab{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
#app{position:relative;z-index:1}
:focus-visible{outline-color:var(--brandd)}
h1,h2,h3,.ph h1,.bv,.amt,.stat,.ramt,.ap h1,.af h2{font-family:'Cormorant Garamond',Georgia,serif}
.ph h1{font-size:46px;font-weight:600;letter-spacing:-.01em;line-height:1.05}

.slot{border-color:var(--line);color:var(--mu)}.slot.on{background:var(--brandl);border-color:var(--brand);color:var(--brandd)}.slot.me{background:var(--brand);border-color:var(--brand);color:var(--on)}
.bar{background:var(--c2)}.bar i{background:linear-gradient(90deg,var(--brand),var(--brandd))}
.track{stroke:var(--line)}

.dot.done circle{fill:var(--brand);stroke:var(--brand)}.dot.done text{fill:var(--on)}
.dot.now circle{fill:var(--paper);stroke:var(--brandd)}.dot.now text{fill:var(--tx)}
.dot.me circle{stroke:var(--tx);stroke-width:3}.dot.empty circle{fill:none}.dot.now.empty circle{fill:rgba(228,199,120,.12)}

.ap .dot.now circle{fill:var(--gold);stroke:var(--gold)}.ap .dot.now text{fill:var(--on)}.ap .rc1{fill:var(--brandd)}.ap .rc2{fill:var(--mu)}
.ap .slot.on{background:var(--brandl);border-color:var(--brand);color:var(--brandd)}.ap .slot.me{background:var(--brand);color:var(--on);border-color:var(--brand)}
.loading{background:var(--paper);color:var(--mu)}.spin circle{stroke:var(--brand)}
#toast{background:var(--c2);color:var(--brandd);border:1px solid var(--brand);border-radius:999px}#toast.err{background:var(--red);color:var(--on)}
.av{background:var(--brand);color:var(--on)}.wn b{color:var(--tx)}.wn span{color:var(--mu)}
.top .ico{color:var(--mu);background:rgba(255,255,255,.06)}.top .ico:hover{background:var(--brand);color:var(--on)}

<body>
<div id="app"></div>
<div id="toast"></div>

<script>
// ====== SETTINGS ======
const SUPABASE_URL = 'https://srqiphdhpgrrnpvkvkly.supabase.co';
const SUPABASE_KEY = 'sb_publishable_AjVvlATOpYbiZJ_HWO8lYQ_ahBJS_nb';
const EMAIL_DOMAIN = '@committee-app.com';
// =======================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let me = null, tab = '', ch = null, tmr = null;
let D = {committees:[],memberships:[],payments:[],payouts:[],accounts:[],profiles:[]};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => 'Rs ' + Number(n || 0).toLocaleString('en-PK');
const fdate = d => d ? new Date(d).toLocaleDateString('en-GB') : '-';
const badge = s => `<span class="badge ${esc(s)}"><i></i>${esc(s)}</span>`;
const empty = (t, icon, btn) => `<div class="empty">${ic(icon || 'inbox', 28)}<p>${esc(t)}</p>${btn ? `<button class="btn sm" onclick="setTab('${btn[0]}')">${esc(btn[1])}</button>` : ''}</div>`;
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function slotMonth(c, n) {
  if (!c || !c.start_date || !n) return null;
  const d = new Date(c.start_date + 'T00:00:00');
  d.setMonth(d.getMonth() + (n - 1));
  const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  return { key, label: MON[d.getMonth()] + ' ' + d.getFullYear() };
}
const pot = c => Number(c.monthly_amount) * Number(c.total_members);
const cleanPhone = p => String(p || '').replace(/[^0-9]/g, '');

function toast(m, err) {
  const t = $('toast'); t.textContent = m; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 4000);
}

// ================= AUTH =================
function logoMark() {
  return '<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="2" y="2" width="10" height="10" rx="2.5" fill="#C8F169"/><rect x="14" y="2" width="10" height="10" rx="2.5" fill="currentColor" opacity=".35"/><rect x="2" y="14" width="10" height="10" rx="2.5" fill="currentColor" opacity=".35"/><rect x="14" y="14" width="10" height="10" rx="2.5" fill="currentColor" opacity=".35"/></svg>';
}
const nowKey = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const fmtMonth = k => { const [y, m] = String(k || '').split('-'); return m ? MON[+m - 1] + ' ' + y : '-'; };
const fmtDT = d => d ? new Date(d).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
const reduced = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- modal ----------
function openModal(html, wide) {
  closeModal();
  const d = document.createElement('div');
  d.id = 'modal'; d.className = 'mback';
  d.innerHTML = `<div class="mbox ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  d.addEventListener('mousedown', e => { if (e.target === d) closeModal(); });
  document.body.appendChild(d);
  const f = d.querySelector('input,select,textarea'); if (f) setTimeout(() => f.focus(), 40);
}
function closeModal() { const m = $('modal'); if (m) m.remove(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }
  toast('Copied');
}

// ---------- rotation ring (the signature visual) ----------
function curIdx(c) {
  if (!c.start_date) return 0;
  const s = new Date(c.start_date + 'T00:00:00'), n = new Date();
  return (n.getFullYear() - s.getFullYear()) * 12 + (n.getMonth() - s.getMonth()) + 1;
}
function ringSVG(c, o = {}) {
  const total = Math.max(1, Math.min(Number(c.total_members) || 1, 60));
  const size = 240, mid = size / 2, R = mid - (total > 24 ? 14 : 24);
  const dr = total <= 12 ? 13 : total <= 24 ? 9.5 : 6;
  const cur = o.cur != null ? o.cur : curIdx(c);
  const names = o.names || {}, filled = o.filled || null, mine = o.mine || 0;
  let dots = '';
  for (let i = 1; i <= total; i++) {
    const a = (i - 1) / total * 2 * Math.PI - Math.PI / 2;
    const x = (mid + R * Math.cos(a)).toFixed(1), y = (mid + R * Math.sin(a)).toFixed(1);
    const sm = slotMonth(c, i);
    const st = i < cur ? 'done' : i === cur ? 'now' : 'up';
    const cls = 'dot ' + st + (isMine(mine, i) ? ' me' : '') + (filled && !filled.has(i) ? ' empty' : '');
    const tip = 'Turn ' + i + (sm ? ' - ' + sm.label : '') + (names[i] ? ' - ' + names[i] : '');
    dots += `<g class="${cls}" data-n="${i}"${isMine(mine, i) ? ' data-me="1"' : ''}><title>${esc(tip)}</title><circle cx="${x}" cy="${y}" r="${dr}"/>${total <= 16 ? `<text x="${x}" y="${y}" dy=".35em">${i}</text>` : ''}</g>`;
  }
  let l1, l2 = '';
  if (cur >= 1 && cur <= total) { l1 = 'Month ' + cur; l2 = 'of ' + total; }
  else if (cur > total) { l1 = 'Finished'; }
  else if (c.start_date) { l1 = 'Starts'; l2 = slotMonth(c, 1).label; }
  else { l1 = 'No start date'; }
  return `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="Payout rotation"><circle class="track" cx="${mid}" cy="${mid}" r="${R}"/>${dots}<text class="rc1" x="${mid}" y="${mid - 2}">${esc(l1)}</text><text class="rc2" x="${mid}" y="${mid + 20}">${esc(l2)}</text></svg>`;
}
const ringLegend = me_ => `<div class="legend"><span><i class="lg done"></i>Received</span><span><i class="lg now"></i>This month</span>${me_ ? '<span><i class="lg me"></i>You</span>' : ''}</div>`;
function setRingCur(svg, cur, total) {
  svg.querySelectorAll('.dot').forEach(g => { const n = +g.dataset.n; g.setAttribute('class', 'dot ' + (n < cur ? 'done' : n === cur ? 'now' : 'up') + (g.dataset.me ? ' me' : '')); });
  const a = svg.querySelector('.rc1'), b = svg.querySelector('.rc2');
  if (a) a.textContent = 'Month ' + cur; if (b) b.textContent = 'of ' + total;
}
let demoT = null;
function stopDemo() { if (demoT) { clearInterval(demoT); demoT = null; } }
function startDemo() {
  stopDemo();
  if (reduced()) return;
  let k = 3;
  demoT = setInterval(() => {
    const root = $('demo'); const svg = root && root.querySelector('svg');
    if (!svg) return stopDemo();
    k = k % 12 + 1; setRingCur(svg, k, 12);
  }, 1300);
}

// ---------- count-up ----------
function animateCounts(root) {
  (root || document).querySelectorAll('[data-count]').forEach(el => {
    const to = Number(el.dataset.count) || 0;
    if (reduced() || !to) { el.textContent = money(to); return; }
    const t0 = performance.now(), dur = 800;
    const step = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = money(Math.round(to * e)); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

// ================= AUTH =================
function showAuth(mode = 'login') {
  stopDemo();
  $('app').innerHTML = `
  <div class="auth in">
    <section class="ap">
      <div class="brand">${logoMark()}<span>AN Committees</span></div>
      <div class="apc">
        <div class="ring-demo" id="demo" aria-hidden="true">${ringSVG({ total_members: 12 }, { cur: 3 })}</div>
        <h1>Every installment, recorded and verified.</h1>
        <p>Join a committee, pay by bank or wallet, and see exactly which month your payout arrives.</p>
      </div>
      <span class="fine">One turn per member, one payout per month.</span>
    </section>
    <section class="af"><div class="af-in">
      <h2>${mode === 'login' ? 'Welcome back' : 'Create your account'}</h2>
      <p class="muted">${mode === 'login' ? 'Log in with your phone number and password.' : 'Your name, phone number and a password are all you need.'}</p>
      <div class="seg">
        <button class="${mode === 'login' ? 'on' : ''}" onclick="showAuth('login')">Log in</button>
        <button class="${mode === 'signup' ? 'on' : ''}" onclick="showAuth('signup')">Sign up</button>
      </div>
      ${mode === 'login' ? `
        <label>Phone number</label><input id="l_phone" type="tel" inputmode="numeric" placeholder="03001234567" autocomplete="username">
        <label>Password</label><input id="l_pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
        <br><button class="btn" style="width:100%" id="lbtn" onclick="doLogin()">Log in</button>
      ` : `
        <label>Full name *</label><input id="s_name">
        <label>Phone number *</label><input id="s_phone" type="tel" inputmode="numeric" placeholder="03001234567">
        <label>CNIC (optional)</label><input id="s_cnic" placeholder="35202-1234567-1">
        <label>Password * (minimum 6 characters)</label><input id="s_pass" type="password" autocomplete="new-password">
        <label>Confirm password *</label><input id="s_pass2" type="password" autocomplete="new-password">
        <br><button class="btn" style="width:100%" id="sbtn" onclick="doSignup()">Create account</button>
      `}
      <div class="credit"><b>Welcome to AN Committees</b><span>Trusted committee management, engineered by Ahsan Ali</span></div>
    </div></section>
  </div>`;
  startDemo();
}
function shakeForm() { const f = document.querySelector('.af-in'); if (!f) return; f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); }

async function doLogin() {
  const phone = cleanPhone($('l_phone').value), pass = $('l_pass').value;
  if (!phone || !pass) { shakeForm(); return toast('Enter phone and password', 1); }
  const b = $('lbtn'); b.disabled = true; b.classList.add('busy');
  const { error } = await sb.auth.signInWithPassword({ email: phone + EMAIL_DOMAIN, password: pass });
  if (error) { b.disabled = false; b.classList.remove('busy'); shakeForm(); return toast('Wrong phone or password', 1); }
  boot();
}

async function doSignup() {
  const name = $('s_name').value.trim(), phone = cleanPhone($('s_phone').value),
        cnic = $('s_cnic').value.trim(), p1 = $('s_pass').value, p2 = $('s_pass2').value;
  const bad = m => { shakeForm(); toast(m, 1); };
  if (!name || !phone || !p1) return bad('Name, phone and password are required');
  if (phone.length < 10 || phone.length > 13) return bad('Enter a valid phone number');
  if (p1.length < 6) return bad('Password must be at least 6 characters');
  if (p1 !== p2) return bad('Passwords do not match');
  const b = $('sbtn'); b.disabled = true; b.classList.add('busy');
  const { data, error } = await sb.auth.signUp({ email: phone + EMAIL_DOMAIN, password: p1, options: { data: { name, phone, cnic } } });
  if (error) {
    b.disabled = false; b.classList.remove('busy'); shakeForm();
    return toast(/registered|exists/i.test(error.message) ? 'This phone number is already registered' : error.message, 1);
  }
  if (!data.session) { toast('Account created, please log in'); return showAuth('login'); }
  boot();
}

async function logout() {
  const s = document.querySelector('.shell'); if (s) s.classList.add('out');
  if (ch) { sb.removeChannel(ch); ch = null; }
  await Promise.all([sb.auth.signOut(), new Promise(r => setTimeout(r, 320))]);
  me = null; D = { committees: [], memberships: [], payments: [], payouts: [], accounts: [], profiles: [] };
  closeModal(); showAuth('login'); toast('You have been logged out');
}

// ================= BOOT / DATA =================
function showLoader() {
  stopDemo();
  $('app').innerHTML = `<div class="loading"><svg class="spin" viewBox="0 0 50 50" aria-hidden="true"><circle cx="25" cy="25" r="20" fill="none" stroke-width="4" stroke-linecap="round"/></svg><p>Loading your committees</p></div>`;
}
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showAuth('login');
  showLoader();
  const ok = await loadData(session.user.id);
  if (!ok) { toast('Profile not found, please log in again', 1); await sb.auth.signOut(); return showAuth('login'); }
  tab = me.role === 'admin' ? 'a_home' : 'm_home';
  renderShell(true);
  subscribeRealtime();
}

async function loadData(uid) {
  const r = await Promise.all([
    sb.from('profiles').select('*').order('created_at', { ascending: false }),
    sb.from('committees').select('*').order('created_at', { ascending: false }),
    sb.from('memberships').select('*, profiles(name,phone), committees(name,monthly_amount)').order('created_at', { ascending: false }),
    sb.from('payments').select('*, profiles!user_id(name,phone), memberships(committees(name))').order('created_at', { ascending: false }),
    sb.from('payouts').select('*, profiles(name,phone), committees(name)').order('created_at', { ascending: false }),
    sb.from('payment_accounts').select('*').order('created_at', { ascending: true }),
    sb.from('membership_shares').select('*'),
    sb.from('committee_draws').select('*').order('created_at', { ascending: false })
  ]);

// ---------- dues: amount-aware (partial payments, next month) ----------
const dueOf = m => { const c = D.committees.find(x => x.id === m.committee_id); return c ? Number(c.monthly_amount) * (m.share_count || 1) : 0; };
const paidOf = (m, key) => D.payments.filter(p => p.membership_id === m.id && p.month_label === key && p.status !== 'rejected').reduce((a, p) => a + Number(p.amount), 0);
const mKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
function memberDue(m) {
  const c = D.committees.find(x => x.id === m.committee_id); if (!c) return null;
  const due = dueOf(m), nk = nowKey();
  let sd = m.created_at ? new Date(m.created_at) : new Date(); sd = new Date(sd.getFullYear(), sd.getMonth(), 1);
  let end = null;
  if (c.start_date) {
    const s0 = new Date(c.start_date + 'T00:00:00'), st = new Date(s0.getFullYear(), s0.getMonth(), 1);
    if (st > sd) sd = st;
    const n = Number(c.duration_months) || Number(c.total_members) || 12;
    end = mKey(new Date(st.getFullYear(), st.getMonth() + n - 1, 1));
  }
  for (let i = 0; i < 60; i++) {
    const key = mKey(new Date(sd.getFullYear(), sd.getMonth() + i, 1));
    if (end && key > end) break;
    const paid = paidOf(m, key);
    if (paid < due) return { key, due, paid, rem: due - paid, state: key <= nk ? 'due' : 'ok', overdue: key < nk };
  }
  return { key: null, due, paid: due, rem: 0, state: 'ok', overdue: false };
}

function payMonthChange() {
  const sel = $('p_mem'), mo = $('p_month'); if (!sel || !mo) return;
  const m = D.memberships.find(x => x.id === sel.value); if (!m || !mo.value) return;
  const due = dueOf(m), paid = paidOf(m, mo.value), rem = Math.max(0, due - paid), h = $('p_hint');
  $('p_amt').value = rem > 0 ? rem : '';
  if (h) h.innerHTML = rem <= 0 ? `<b>${fmtMonth(mo.value)}</b> is already fully paid (${money(due)}). Choose another month.`
    : paid > 0 ? `<b>${fmtMonth(mo.value)}</b>: ${money(paid)} paid of ${money(due)}. <b>${money(rem)}</b> is still due.`
    : `<b>${fmtMonth(mo.value)}</b>: ${money(due)} due.`;
  if (h) h.className = 'phint' + (rem <= 0 ? ' ok' : paid > 0 ? ' part' : '');
}

async function submitPay() {
  const mid = $('p_mem').value, month = $('p_month').value, amount = Number($('p_amt').value),
        method = document.querySelector('input[name=pm]:checked').value, note = $('p_note').value.trim();
  if (!month) return toast('Select a month', 1);
  if (!amount || amount <= 0) return toast('Enter a valid amount', 1);
  const mm0 = D.memberships.find(x => x.id === mid), rem0 = mm0 ? Math.max(0, dueOf(mm0) - paidOf(mm0, month)) : 0;
  if (rem0 <= 0) return toast(fmtMonth(month) + ' is already fully paid. Choose the next month', 1);
  if (amount > rem0) return toast('Only ' + money(rem0) + ' is still due for ' + fmtMonth(month), 1);
  if (method === 'bank' && !$('p_acc')) return toast('No payment account available. Contact the admin', 1);
  const acc = (method === 'bank' && $('p_acc')) ? $('p_acc').value : null;
  let path = null;
  $('pbtn').disabled = true;
  if (method === 'bank') {
    const f = $('p_file').files[0];
    if (!f) { $('pbtn').disabled = false; return toast('Payment proof is required', 1); }
    if (f.size > 5 * 1024 * 1024) { $('pbtn').disabled = false; return toast('File must be under 5MB', 1); }
    path = `${me.id}/${Date.now()}_${f.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
    const up = await sb.storage.from('proofs').upload(path, f);
    if (up.error) { $('pbtn').disabled = false; return toast('Upload failed: ' + up.error.message, 1); }
  }
  const { error } = await sb.from('payments').insert({
    membership_id: mid, user_id: me.id, month_label: month, amount, method, proof_path: path, account_label: acc, note: note || null, status: 'pending'
  });
  if (error) { $('pbtn').disabled = false; return toast(/duplicate|unique/i.test(error.message) ? 'The database allows one payment per month. Ask the admin to enable part payments' : 'Payment could not be saved: ' + error.message, 1); }
  toast('Payment submitted. Admin will verify it');
  tab = 'm_history'; await loadData(); renderNav(); renderTab();
}

  $('ap_ok') && ($('ap_ok').disabled = true);
  const { error } = await sb.from('memberships').update({ status: 'approved', slot_number: slot }).eq('id', id);
  if (error) { $('ap_ok') && ($('ap_ok').disabled = false); return toast(error.code === '23505' ? 'That turn was just taken. Pick another one' : error.message, 1); }

async function delPayment(id) {
  const p = D.payments.find(x => x.id === id); if (!p) return;
  const msg = (p.status === 'verified' ? 'This payment is already VERIFIED. Deleting it removes the receipt and the member will owe ' + money(p.amount) + ' again.\n\n' : '') +
    'Delete ' + money(p.amount) + ' from ' + (p.profiles?.name || 'member') + ' for ' + fmtMonth(p.month_label) + '? This cannot be undone.';
  if (!confirm(msg)) return;
  const { error, count } = await sb.from('payments').delete({ count: 'exact' }).eq('id', id);
  if (error) return toast(error.message, 1);
  if (count === 0) return toast('Delete was blocked by database permissions. Run the delete-policy SQL in Supabase first.', 1);
  if (p.proof_path) { try { await sb.storage.from('proofs').remove([p.proof_path]); } catch (e) {} }
  toast('Payment deleted'); await loadData(); renderNav(); renderTab(false);
}

async function saveCommittee(id) {
  const name = $('e_name').value.trim(), amt = Number($('e_amt').value), mem = Number($('e_mem').value);
  if (!name || !amt || !mem) return toast('Name, amount and members are required', 1);
  if (mem > 60) return toast('Maximum 60 members per committee', 1);
  const maxSlot = Math.max(0, ...D.shares.filter(s => s.committee_id === id && s.slot_number).map(s => s.slot_number));
  if (mem < maxSlot) return toast('Turn ' + maxSlot + ' is already assigned. Total members cannot be less than that', 1);
  const { error } = await sb.from('committees').update({
    name, monthly_amount: amt, total_members: mem, start_date: $('e_start').value || null,
    duration_months: Number($('e_dur').value) || null, show_roster: $('e_roster').checked
  }).eq('id', id);
  if (error) return toast(error.message, 1);
  closeModal(); toast('Committee updated'); await loadData(); renderTab(false);
}

function vASchedule() {
  if (!D.committees.length) return empty('No committees yet. Create one to see its payout schedule.', 'layers', ['a_committees', 'Create a committee']);
  return D.committees.map(c => {
    const mems = D.memberships.filter(m => m.committee_id === c.id && m.status === 'approved');
    const mids = new Set(D.memberships.filter(m => m.committee_id === c.id).map(m => m.id));
    const shs = D.shares.filter(s => s.committee_id === c.id && mems.some(m => m.id === s.membership_id));
    const mof = s => mems.find(m => m.id === s.membership_id);
    const lab = s => (mof(s).profiles?.name || '?') + (mof(s).share_count > 1 ? ' (share ' + s.share_number + ')' : '');
    const loose = shs.filter(s => !s.slot_number);
    let rows = '';
    for (let n = 1; n <= c.total_members; n++) {
      const h = shs.find(s => s.slot_number === n), sm = slotMonth(c, n);
      const po = h ? D.payouts.find(p => p.committee_id === c.id && (p.share_id ? p.share_id === h.id : p.member_id === mof(h).user_id) && (!sm || p.month_label === sm.key)) : null;
      const coll = sm ? D.payments.filter(p => p.status === 'verified' && p.month_label === sm.key && mids.has(p.membership_id)).reduce((a, p) => a + Number(p.amount), 0) : 0;
      const opts = '<option value="">Empty</option>' + shs.map(s => `<option value="${s.id}" ${h && s.id === h.id ? 'selected' : ''}>${esc(lab(s))}${s.slot_number && !(h && s.id === h.id) ? ' (turn ' + s.slot_number + ')' : ''}</option>`).join('');
      const status = po ? badge(po.status) : '<span class="muted">not paid yet</span>';
      const act = ((h && sm && !po) ? `<button class="btn sm" onclick="markPayout('${c.id}','${h.id}','${sm.key}',${pot(c)})">Mark paid</button>` : (po && po.status !== 'paid' ? `<button class="btn sm" onclick="payoutPaid('${po.id}')">Mark paid</button>` : '')) + (po ? `<button class="btn sm red" onclick="delPayout('${po.id}')">Undo</button>` : '');
      rows += `<tr class="${sm && sm.key === nowKey() ? 'cur' : ''}"><td><b>${sm ? sm.label : '-'}</b></td><td>${n}</td>
        <td><select class="cell" onchange="assignSlot('${c.id}', ${n}, this.value)">${opts}</select></td>
        <td>${money(pot(c))}</td><td>${sm ? money(coll) : '-'}</td><td>${status}</td><td>${act}</td></tr>`;
    }
    return `<div class="sh"><div><h2 style="margin:0">${esc(c.name)} ${badge(c.status)}</h2>
      <p class="muted" style="margin:4px 0 0">${c.start_date ? 'Starts ' + fdate(c.start_date) : 'No start date yet. Use Edit on the Committees tab.'} · ${money(c.monthly_amount)} per share · pot ${money(pot(c))} per turn</p></div>
      <div class="actions"><button class="btn sm out" onclick="copySchedule('${c.id}')">Copy for WhatsApp</button></div></div>
      ${loose.length ? `<div class="note">${loose.length} share${loose.length === 1 ? ' has' : 's have'} no turn yet: ${loose.map(x => esc(lab(x))).join(', ')}. Pick them below or use the Lucky draw.</div>` : ''}
      <div class="card tw"><table><tr><th>Payout month</th><th>Turn</th><th>Receives the pot</th><th>Pot</th><th>Collected that month</th><th>Payout</th><th></th></tr>${rows}</table></div>`;
  }).join('<div style="height:18px"></div>');
}
async function assignSlot(cid, n, sid) {
  const rpc = (id, slot) => sb.rpc('assign_membership_share_slot', { p_share_id: id, p_slot_number: slot });
  const holder = D.shares.find(s => s.committee_id === cid && s.slot_number === n);
  let r = {};
  if (!sid) { if (!holder) return; r = await rpc(holder.id, null); }
  else {
    const t = D.shares.find(s => s.id === sid); if (!t || (holder && holder.id === t.id)) return;
    const prev = t.slot_number || null;
    if (holder) {
      if (!confirm('Turn ' + n + ' is already taken. Swap the two?')) return renderTab(false);
      r = await rpc(holder.id, null); if (!r.error) r = await rpc(t.id, n); if (!r.error && prev) r = await rpc(holder.id, prev);
    } else r = await rpc(t.id, n);
  }
  toast(r.error ? r.error.message : 'Turn saved', !!r.error); await loadData(); renderTab(false);
}
function copySchedule(cid) {
  const c = D.committees.find(x => x.id === cid); if (!c) return;
  const lines = [c.name, money(c.monthly_amount) + ' per share, pot ' + money(pot(c)) + ' per month', ''];
  for (let n = 1; n <= c.total_members; n++) {
    const sh = D.shares.find(x => x.committee_id === cid && x.slot_number === n), m = sh && D.memberships.find(x => x.id === sh.membership_id), sm = slotMonth(c, n);
    lines.push(n + '. ' + (sm ? sm.label : '-') + ' - ' + (m ? m.profiles?.name : '(open)'));
  }
  copyText(lines.join('\n'));
}
async function markPayout(cid, sid, key, amt) {
  if (!confirm('Mark this payout as paid? Only do this after you have handed over the money.')) return;
  const sh = D.shares.find(x => x.id === sid), m = sh && D.memberships.find(x => x.id === sh.membership_id);
  if (!m) return toast('Share not found', 1);
  const { error } = await sb.from('payouts').insert({ committee_id: cid, member_id: m.user_id, share_id: sid, month_label: key, amount: amt, status: 'paid' });
  if (error) return toast(error.message, 1);
  toast('Payout marked as paid'); await loadData(); renderTab();
}

function vABackup() {
  return `<div class="card" style="max-width:560px"><h2>Download a full backup</h2>
    <p class="muted">One Excel file with separate sheets for members, committees, join requests, payments, payouts, the payout schedule and payment accounts. Payment proof images are not included.</p>
    <br><button class="btn" id="bkbtn" onclick="downloadBackup()">Download Excel backup</button></div>`;
}
function loadXlsx() {
  return new Promise((res, rej) => {
    if (window.XLSX) return res();
    const t = document.createElement('script');
    t.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    t.onload = res; t.onerror = rej; document.head.appendChild(t);
  });
}
async function downloadBackup() {
  try { await loadXlsx(); } catch (e) { return toast('Could not load the Excel library. Check your internet and try again', 1); }
  const cn = id => (D.committees.find(c => c.id === id) || {}).name || '';
  const sheets = {
    Members: D.profiles.map(p => ({ Name: p.name, Phone: p.phone, CNIC: p.cnic || '', Role: p.role, Joined: fdate(p.created_at) })),
    Committees: D.committees.map(c => ({ Name: c.name, 'Member list shared': c.show_roster ? 'Yes' : 'No', 'Monthly amount': c.monthly_amount, 'Total members': c.total_members, 'Pot per month': pot(c), 'Start date': c.start_date || '', 'Duration (months)': c.duration_months || '', Status: c.status })),
    'Join requests': D.memberships.map(m => ({ Member: m.profiles?.name, Phone: m.profiles?.phone, Committee: m.committees?.name, Slot: m.slot_number || '', Status: m.status, Date: fdate(m.created_at) })),
    Payments: D.payments.map(p => ({ Member: p.profiles?.name, Phone: p.profiles?.phone, Committee: p.memberships?.committees?.name, Month: p.month_label, Amount: p.amount, Method: p.method, Account: p.account_label || '', Status: p.status, Note: p.note || '', Receipt: p.receipt_no || '', Submitted: fdate(p.created_at), Verified: fdate(p.verified_at) })),
    Payouts: D.payouts.map(p => ({ Committee: p.committees?.name, Member: p.profiles?.name, Phone: p.profiles?.phone, Month: p.month_label, Amount: p.amount, Status: p.status })),
    Schedule: [],
    Accounts: D.accounts.map(a => ({ Type: a.type, Name: a.provider, Title: a.account_title, Number: a.account_number, IBAN: a.iban || '', Visible: a.active ? 'Yes' : 'No' }))
  };
  D.committees.forEach(c => {
    for (let n = 1; n <= c.total_members; n++) {
      const m = D.memberships.find(x => x.committee_id === c.id && x.status === 'approved' && x.slot_number === n), sm = slotMonth(c, n);
      const po = m ? D.payouts.find(p => p.committee_id === c.id && p.member_id === m.user_id && (!sm || p.month_label === sm.key)) : null;
      sheets.Schedule.push({ Committee: c.name, 'Payout month': sm ? sm.label : '', Slot: n, Member: m ? m.profiles?.name : '', Phone: m ? m.profiles?.phone : '', Pot: pot(c), Payout: po ? po.status : 'not paid yet' });
    }
  });
  const wb = XLSX.utils.book_new();
  Object.entries(sheets).forEach(([name, rows]) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [{ Info: 'No data' }]), name));
  XLSX.writeFile(wb, 'committee-backup-' + new Date().toISOString().slice(0, 10) + '.xlsx');
  toast('Backup downloaded');
}

function vABank() {
  const list = D.accounts;
  return `<div class="card" style="max-width:560px"><h2>Add Payment Account</h2>
    <p class="muted">Add as many banks or wallets (JazzCash, Easypaisa, etc.) as you want. Members will choose one when paying.</p>
    <label>Type</label><select id="a_type"><option value="Bank">Bank</option><option value="Mobile Wallet">Mobile Wallet</option><option value="Other">Other</option></select>
    <label>Bank / Wallet Name *</label><input id="a_prov" placeholder="e.g. HBL, Meezan, JazzCash, Easypaisa">
    <label>Account Title *</label><input id="a_title">
    <label>Account / Wallet Number *</label><input id="a_num">
    <label>IBAN (optional)</label><input id="a_iban">
    <label>Note (optional)</label><input id="a_note" placeholder="e.g. Please attach a screenshot after payment">
    <br><button class="btn" onclick="addAccount()">Add Account</button></div>
    <h2 class="sec">My accounts</h2>` +
    (list.length ? `<div class="card tw"><table><tr><th>Name</th><th>Type</th><th>Title</th><th>Number</th><th>Visible</th><th></th></tr>` +
      list.map(a => `<tr><td>${esc(a.provider)}</td><td>${esc(a.type)}</td><td>${esc(a.account_title)}</td><td>${esc(a.account_number)}${a.iban ? '<br><span class="muted">' + esc(a.iban) + '</span>' : ''}</td>
      <td>${a.active ? badge('open') : badge('closed')}</td>
      <td class="actions"><button class="btn sm gray" onclick="toggleAcc('${a.id}', ${a.active})">${a.active ? 'Hide' : 'Show'}</button><button class="btn sm red" onclick="delAcc('${a.id}')">Delete</button></td></tr>`).join('') + '</table></div>' : empty('No payment accounts added yet'));
}
async function addAccount() {
  const provider = $('a_prov').value.trim(), title = $('a_title').value.trim(), num = $('a_num').value.trim();
  if (!provider || !title || !num) return toast('Name, title and number are required', 1);
  const { error } = await sb.from('payment_accounts').insert({
    type: $('a_type').value, provider, account_title: title, account_number: num,
    iban: $('a_iban').value.trim() || null, note: $('a_note').value.trim() || null
  });
  if (error) return toast(error.message, 1);
  toast('Account added'); await loadData(); renderTab();
}
async function toggleAcc(id, active) {
  const { error } = await sb.from('payment_accounts').update({ active: !active }).eq('id', id);
  if (error) return toast(error.message, 1); refresh();
}
async function delAcc(id) {
  if (!confirm('Delete this account?')) return;
  const { error } = await sb.from('payment_accounts').delete().eq('id', id);
  if (error) return toast(error.message, 1); refresh();
}

// ================= SHARES / ADMINS / WHEEL =================
const isMine = (m, i) => m && m.has ? m.has(i) : m === i;
function mySlots(m) { return new Set(D.shares.filter(s => s.membership_id === m.id && s.slot_number).map(s => s.slot_number)); }
function shareLines(c, m) {
  const sh = D.shares.filter(s => s.membership_id === m.id).sort((a, b) => a.share_number - b.share_number);
  const n = m.share_count || 1;
  let h = `<p class="pay-line"><b>${n} share${n > 1 ? 's' : ''}</b> · you pay ${money(c.monthly_amount * n)} per month</p>`;
  (sh.length ? sh : [{ share_number: 1, slot_number: m.slot_number }]).forEach(s => {
    const sm = slotMonth(c, s.slot_number);
    h += `<p class="pay-line">${n > 1 ? 'Share ' + s.share_number + ': ' : ''}${s.slot_number ? (sm ? 'You receive <b>' + money(pot(c)) + '</b> in <b>' + sm.label + '</b> (turn ' + s.slot_number + ')' : 'Turn ' + s.slot_number + ', month appears once the start date is set') : '<span class="muted">Turn not assigned yet</span>'}</p>`;
  });
  return h;
}
function joinC(id) {
  const c = D.committees.find(x => x.id === id); if (!c) return;
  const mx = Math.min(20, c.total_members);
  openModal(`<h2>Join ${esc(c.name)}</h2><p class="muted">${money(c.monthly_amount)} per share per month · pot ${money(pot(c))} per share</p>
    <label>How many shares do you want?</label>
    <select id="j_sh">${Array.from({ length: mx }, (_, i) => `<option value="${i + 1}">${i + 1} share${i ? 's' : ''} · pay ${money(c.monthly_amount * (i + 1))}/month · ${i + 1} payout${i ? 's' : ''} of ${money(pot(c))}</option>`).join('')}</select>
    <p class="muted" style="margin-top:8px">Each share gets its own payout turn, chosen by the admin or the lucky draw.</p>
    <div class="mfoot"><button class="btn gray" onclick="closeModal()">Cancel</button><button class="btn" id="j_ok" onclick="sendJoin('${id}')">Send request</button></div>`);
}
async function sendJoin(id) {
  const n = Number($('j_sh').value) || 1; $('j_ok').disabled = true;
  const { error } = await sb.from('memberships').insert({ user_id: me.id, committee_id: id, status: 'pending', share_count: n });
  if (error) { $('j_ok').disabled = false; return toast('Request failed: ' + error.message, 1); }
  closeModal(); toast('Request sent. Please wait for admin approval'); refresh();
}
async function addShare(mid) {
  if (!confirm('Add one more share? Your monthly payment goes up by one share.')) return;
  const { error } = await sb.rpc('request_add_membership_share', { p_membership_id: mid });
  if (error) return toast(error.message, 1);
  toast('Share added. The admin will give it a turn'); await loadData(); renderTab(false);
}
function adminCell(p) {
  let h = '';
  if (p.role === 'admin') {
    if (p.is_owner) return '<span class="badge approved"><i></i>Owner</span>';
    if (me.is_owner) h = `<button class="btn sm gray" onclick="setAdmin('${p.id}', false)">Remove admin</button>`;
  } else {
    if (me.is_owner) h = `<button class="btn sm out" onclick="setAdmin('${p.id}', true)">Make admin</button> `;
    h += `<button class="btn sm red" onclick="delMember('${p.id}')">Delete</button>`;
  }
  return '<div class="actions">' + h + '</div>';
}
async function setAdmin(id, on) {
  const p = D.profiles.find(x => x.id === id); if (!p) return;
  if (!confirm(on ? 'Make ' + p.name + ' an admin? They can manage everything except owner settings.' : 'Remove admin access from ' + p.name + '?')) return;
  const { error } = await sb.rpc('set_admin', { target: id, make_admin: on });
  if (error) return toast(error.message, 1);
  toast(on ? 'Admin added' : 'Admin removed'); await loadData(); renderTab(false);
}

let wheelCid = null; const wheelDone = new Set(); window.wheelBusy = false;
const wheelComms = () => me.role === 'admin' ? D.committees : D.committees.filter(c => D.memberships.some(m => m.committee_id === c.id && m.user_id === me.id && m.status === 'approved'));
function monthSlot(c, key) {
  if (!c.start_date || !key) return null;
  const s = new Date(c.start_date + 'T00:00:00'), [y, m] = key.split('-').map(Number);
  const n = (y - s.getFullYear()) * 12 + (m - 1 - s.getMonth()) + 1;
  return n >= 1 && n <= c.total_members ? n : null;
}
function wheelSVG(names) {
  const n = names.length || 1, cols = ['#12151C', '#1E2330', '#161A24', '#242B3B', '#10131A', '#1A1F2C'];
  let s = '';
  names.forEach((w, i) => {
    const a0 = i / n * 2 * Math.PI, a1 = (i + 1) / n * 2 * Math.PI, P = a => (120 + 112 * Math.sin(a)).toFixed(1) + ' ' + (120 - 112 * Math.cos(a)).toFixed(1);
    const mid = (i + .5) * 360 / n;
    s += `<path d="M120 120 L${P(a0)} A112 112 0 0 1 ${P(a1)} Z" fill="${cols[i % cols.length]}" stroke="#C9A44C" stroke-width="1.2"/>` +
      `<text transform="rotate(${mid - 90} 120 120)" x="226" y="123.5" text-anchor="end" font-size="${n > 20 ? 7 : n > 12 ? 9 : 11}" font-weight="700" fill="#F3EDE0">${esc(String(w.name || '').slice(0, 13))}</text>`;
  });
  return `<svg viewBox="0 -16 240 256"><g id="whg" style="transform-origin:120px 120px">${s}</g><circle cx="120" cy="120" r="14" fill="#C9A44C" stroke="#0B0D12" stroke-width="4"/><path d="M108 -14 L132 -14 L120 8 Z" fill="#E4C778"/></svg>`;
}
function vWheel() {
  const cs = wheelComms();
  if (!cs.length) return empty('No committee yet for the lucky draw', 'layers');
  if (!cs.find(c => c.id === wheelCid)) wheelCid = cs[0].id;
  const c = cs.find(x => x.id === wheelCid), adm = me.role === 'admin';
  const ds = D.draws.filter(d => d.committee_id === c.id), d = ds[0];
  const free = D.shares.filter(s => s.committee_id === c.id && !s.slot_number).length;
  let ctl = '';
  if (adm) {
    if (!d || d.status === 'completed') ctl = `<label>Draw for month</label><input id="w_month" type="month" value="${nowKey()}"><p class="muted" style="margin-top:8px">${free} share${free === 1 ? '' : 's'} without a turn will be on the wheel.</p><br><button class="btn" onclick="createDraw('${c.id}')">Create draw</button>`;
    else if (d.status === 'scheduled') ctl = `<p class="muted">Draw for ${fmtMonth(d.month_label)} is ready. Members can already see the wheel.</p><div class="actions"><button class="btn" onclick="startSpin('${d.id}')">Spin the wheel</button><button class="btn gray" onclick="cancelDraw('${d.id}')">Cancel</button></div>`;
    else ctl = '<p class="muted">Spinning...</p>';
  } else ctl = d && d.status !== 'completed' ? `<p>Draw for <b>${fmtMonth(d.month_label)}</b>. Stay on this page to watch it live.</p>` : '<p class="muted">The admin will start the next draw here.</p>';
  const done = ds.filter(x => x.status === 'completed');
  return `<div class="two"><div class="card"><select id="w_c" onchange="wheelCid=this.value;renderTab(false)">${cs.map(x => `<option value="${x.id}" ${x.id === c.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
    <div class="wheelbox">${d ? wheelSVG(d.wheel_names) : '<p class="muted">No draw yet.</p>'}</div><h3 id="wstat" style="text-align:center;margin:8px 0 0"></h3></div>
    <div class="card">${ctl}<h3 style="margin-top:20px">Past draws</h3>${done.length ? `<table><tr><th>Month</th><th>Winner</th></tr>${done.map(x => `<tr><td>${fmtMonth(x.month_label)}</td><td>${esc(x.winner_name)}</td></tr>`).join('')}</table>` : '<p class="muted">Nothing yet.</p>'}</div></div>`;
}
async function createDraw(cid) {
  const month = $('w_month').value; if (!month) return toast('Pick a month', 1);
  const items = [];
  D.shares.filter(s => s.committee_id === cid && !s.slot_number).forEach(s => {
    const m = D.memberships.find(x => x.id === s.membership_id && x.status === 'approved');
    if (m) items.push({ membership_id: m.id, name: (m.profiles?.name || '?') + (m.share_count > 1 ? ' #' + s.share_number : '') });
  });
  if (items.length < 2) return toast('At least 2 shares without a turn are needed', 1);
  items.sort(() => Math.random() - .5);
  const { error } = await sb.from('committee_draws').insert({ committee_id: cid, month_label: month, wheel_names: items, created_by: me.id });
  if (error) return toast(error.message, 1);
  toast('Draw created'); await loadData(); renderTab(false);
}
async function cancelDraw(id) {
  if (!confirm('Cancel this draw?')) return;
  const { error } = await sb.from('committee_draws').delete().eq('id', id);
  if (error) return toast(error.message, 1); await loadData(); renderTab(false);
}
async function startSpin(id) {
  const { error } = await sb.rpc('prepare_committee_draw', { p_draw_id: id });
  if (error) return toast(error.message, 1);
  await loadData(); renderTab(false);
}
async function wheelAssign(d, c) {
  const sh = D.shares.filter(s => s.membership_id === d.winner_membership_id && !s.slot_number).sort((a, b) => a.share_number - b.share_number)[0], sl = monthSlot(c, d.month_label);
  if (!sh || !sl) return toast('Winner chosen. Give the turn manually from Schedule', 1);
  const { error } = await sb.rpc('assign_membership_share_slot', { p_share_id: sh.id, p_slot_number: sl });
  toast(error ? error.message : d.winner_name + ' gets ' + fmtMonth(d.month_label), !!error);
}
function wheelInit() {
  const g = $('whg'), st = $('wstat'); if (!g) return;
  const c = D.committees.find(x => x.id === wheelCid), d = D.draws.filter(x => x.committee_id === wheelCid)[0]; if (!d) return;
  const n = d.wheel_names.length || 1, center = ((d.winner_index || 0) + .5) * 360 / n;
  const show = () => { st.textContent = 'Winner: ' + d.winner_name; };
  if (d.status === 'scheduled') { st.textContent = 'Waiting for the admin to spin'; return; }
  if (d.status === 'completed' || wheelDone.has(d.id)) { g.style.transform = `rotate(${-center}deg)`; show(); return; }
  window.wheelBusy = true; st.textContent = 'Spinning...';
  requestAnimationFrame(() => requestAnimationFrame(() => { g.style.transition = 'transform 7s cubic-bezier(.12,.6,.1,1)'; g.style.transform = `rotate(${360 * 7 - center}deg)`; }));
  setTimeout(async () => {
    wheelDone.add(d.id); window.wheelBusy = false; show();
    if (me.role === 'admin') { const { error } = await sb.rpc('complete_committee_draw', { p_draw_id: d.id }); if (error) toast(error.message, 1); else await wheelAssign(d, c); }
    await loadData(); renderTab(false);
  }, 7400);
}

// ================= START =================
boot();
</script>
